name: 项目检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 检查浏览器脚本语法
        run: |
          node --check dist/core.js
          node --check dist/app.js
      - name: 验证任务、计时与备份逻辑
        run: node --test tests/core.test.cjs
